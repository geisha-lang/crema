name = "crema"
version = "0.1.1"
src_dir = "src"
tests = ["tests/spec.gsa"]

[target.wasm32]
exports = [
  "crema_init",
  "crema_step_frame",
  "crema_pointer_move",
  "crema_pointer_click",
  "crema_pointer_drag",
  "crema_scroll_wheel",
  "crema_text_input",
  "crema_text_submit",
  "crema_blur_input",
  "crema_key_down",
  "crema_on_net_open",
  "crema_on_net_message",
  "crema_on_net_close",
]
web_assets = ["host/web/crema.js"]

[target.native]
c_sources = ["host/native/crema_macos.m"]
c_flags = ["-fobjc-arc"]
link_flags = ["-framework", "Cocoa", "-framework", "QuartzCore", "-pthread"]
owns_main = true
boot_symbol = "__geisha_crema_boot"
exports = [
  "crema_init",
  "crema_step_frame",
  "crema_pointer_move",
  "crema_pointer_click",
  "crema_pointer_drag",
  "crema_scroll_wheel",
  "crema_text_input",
  "crema_text_submit",
  "crema_blur_input",
  "crema_key_down",
  "crema_on_net_open",
  "crema_on_net_message",
  "crema_on_net_close",
]
